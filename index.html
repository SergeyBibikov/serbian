<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <title>Srpski</title>
  </head>

  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1f2937;
      --accent: #4f46e5;
      --accent-soft: #eef0ff;
      --on-accent: #ffffff;
      --border: #e5e7eb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #e5e7eb;
        --accent: #818cf8;
        --accent-soft: #2b3553;
        --on-accent: #0f172a;
        --border: #334155;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 1rem;
      display: grid;
      place-items: center;
      font-family:
        system-ui,
        -apple-system,
        "Segoe UI",
        Roboto,
        sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 1.25rem;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 56px;
      padding: 0.9rem 1.25rem;
      border-radius: 12px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.3;
      text-decoration: none;
      transition:
        transform 0.15s,
        background 0.15s,
        color 0.15s;
    }

    a::after {
      content: "›";
      flex-shrink: 0;
      font-size: 1.5rem;
      line-height: 1;
      opacity: 0.7;
    }

    a:hover,
    a:focus-visible {
      background: var(--accent);
      color: var(--on-accent);
      outline: none;
    }

    a:active {
      transform: scale(0.97);
      background: var(--accent);
      color: var(--on-accent);
    }
  </style>

  <body>
    <ul>
      <li><a href="./alphabet_cyr.html">Алфавит кир.</a></li>
      <li><a href="./alphabet_lat.html">Алфавит лат.</a></li>
      <li><a href="./words.html">Словарь</a></li>
      <li><a href="./words_learning/main.html">Слова для заучивания</a></li>
    </ul>
  </body>
</html>
