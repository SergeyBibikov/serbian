<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Учење речи</title>
  </head>

  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1f2937;
      --accent: #4f46e5;
      --accent-soft: #eef0ff;
      --on-accent: #ffffff;
      --border: #e5e7eb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #e5e7eb;
        --accent: #818cf8;
        --accent-soft: #2b3553;
        --on-accent: #0f172a;
        --border: #334155;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family:
        system-ui,
        -apple-system,
        "Segoe UI",
        Roboto,
        sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 2rem;
      width: min(90%, 380px);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    a {
      display: block;
      padding: 1rem 1.25rem;
      border-radius: 12px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      transition:
        transform 0.15s,
        background 0.15s,
        color 0.15s;
    }

    a:hover,
    a:focus-visible {
      background: var(--accent);
      color: var(--on-accent);
      transform: translateY(-2px);
      outline: none;
    }
  </style>

  <body>
    <ul>
      <li><a href="./revision.html">Для повторения</a></li>
      <li><a href="./current.html">Текущие</a></li>
    </ul>
  </body>
</html>
